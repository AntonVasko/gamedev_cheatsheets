<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шпаргалки GameDev</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #533483);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0 20px;
            overflow-x: hidden;
            position: relative;
            color: #fff;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Плавающие круги на фоне */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 20s infinite ease-in-out;
        }
        .bubble:nth-child(1) { width: 200px; height: 200px; top: 10%; left: 10%; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 150px; height: 150px; top: 70%; left: 80%; animation-delay: 3s; }
        .bubble:nth-child(3) { width: 100px; height: 100px; top: 40%; left: 70%; animation-delay: 6s; }
        .bubble:nth-child(4) { width: 250px; height: 250px; top: 80%; left: 20%; animation-delay: 9s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(30px, -50px) scale(1.1); }
            66%      { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* Главная карточка */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 50px 50px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 90%;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Кнопка «На главную» */
        .topbar {
            text-align: left;
            margin-bottom: 28px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            text-decoration: none;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .back:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.1); }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #ffd86b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 32px;
            font-size: 1.05rem;
        }

        /* Список разделов */
        .menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Кнопка */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 36px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #1a1a2e;
            background: linear-gradient(135deg, #ffd86b, #ffb347);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 179, 71, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before { left: 100%; }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 179, 71, 0.6);
        }

        .btn:active { transform: translateY(-1px); }

        .btn-icon {
            font-size: 1.4rem;
        }

        /* Видимый фокус при навигации с клавиатуры */
        .btn:focus-visible,
        .back:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        footer {
            position: relative;
            z-index: 2;
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .container { padding: 28px 24px 36px; }
            h1 { font-size: 1.8rem; }
            .btn { padding: 14px 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Декоративные круги -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="container">
        <!-- Возврат на главную: вставьте ссылку на главную страницу вместо # -->
        <div class="topbar">
            <a href="https://antonvasko.github.io/" class="back">
                <span>🏠</span>
                <span>На главную</span>
            </a>
        </div>

        <div class="logo">🎮</div>
        <h1>Шпаргалки GameDev</h1>
        <p class="subtitle">Выберите игровой движок или библиотеку</p>

        <!-- Вставьте свои ссылки вместо # в атрибутах href -->
        <nav class="menu">
            <a href="#" class="btn">
                <span class="btn-icon">🐍</span>
                <span>Pygame</span>
            </a>

            <a href="#" class="btn">
                <span class="btn-icon">🐼</span>
                <span>Panda3D</span>
            </a>

            <a href="ursina_cheat.html" class="btn">
                <span class="btn-icon">🐻</span>
                <span>Ursina</span>
            </a>

            <a href="#" class="btn">
                <span class="btn-icon">🤖</span>
                <span>Godot</span>
            </a>
        </nav>
    </div>

    <footer>© 2026 Учебные шпаргалки by Vasko Anton</footer>
</body>
</html>
